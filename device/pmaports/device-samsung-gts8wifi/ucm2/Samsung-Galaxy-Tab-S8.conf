Syntax 4

# UCM profile for the Galaxy Tab S8 (SM-X700, gts8wifi); from the Tab S8+ port.
#
# No WSA/WCD codecs on this board: the four Cirrus CS35L45 amplifiers hang
# off PRIMARY MI2S. Nothing here matches the SM8450 HDK profile, so the
# routing is spelled out.

SectionUseCase."HiFi" {
	File "/Qualcomm/sm8450/gts8wifi/HiFi.conf"
	Comment "HiFi quality Music."
}

BootSequence [
	# Per-amplifier hardware volume, 0.25 dB per step: 457 is 0 dB, 300 is about -39 dB
	# (the level used on this tablet). The Cirrus speaker-protection DSP firmware is not
	# loaded, so nothing limits excursion in hardware. Raise this only together with
	# working speaker protection.
	cset "name='Front Left Digital PCM Volume' 300"
	cset "name='Front Right Digital PCM Volume' 300"
	cset "name='Rear Left Digital PCM Volume' 300"
	cset "name='Rear Right Digital PCM Volume' 300"
	cset "name='Front Left Analog PCM Volume' 3"
	cset "name='Front Right Analog PCM Volume' 3"
	cset "name='Rear Left Analog PCM Volume' 3"
	cset "name='Rear Right Analog PCM Volume' 3"
	# Stereo over the two I2S channels: left amps take ASP_RX1 (slot 0),
	# right amps take ASP_RX2 (slot 1).
	cset "name='Front Left DACPCM Source' ASP_RX1"
	cset "name='Rear Left DACPCM Source' ASP_RX1"
	cset "name='Front Right DACPCM Source' ASP_RX2"
	cset "name='Rear Right DACPCM Source' ASP_RX2"
]

Include.card-init.File "/lib/card-init.conf"
